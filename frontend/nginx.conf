# ============================================================
# nginx configuration — React SPA
# Cell & Gene Therapy Tracking Platform
# ============================================================

# Use all available CPU cores
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off; # hide nginx version

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/opentype
        font/otf
        image/bmp
        image/svg+xml
        image/vnd.microsoft.icon
        image/x-icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/x-component
        text/x-cross-domain-policy;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # --------------------------------------------------
        # Security headers
        # --------------------------------------------------
        add_header X-Frame-Options            "SAMEORIGIN"       always;
        add_header X-Content-Type-Options     "nosniff"          always;
        add_header X-XSS-Protection           "1; mode=block"    always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline' https://www.gstatic.com; "
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
            "font-src 'self' https://fonts.gstatic.com; "
            "img-src 'self' data: https:; "
            "connect-src 'self' https://*.run.app https://*.googleapis.com https://clinicaltrials.gov https://api.fda.gov; "
            "frame-ancestors 'none';"
            always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

        # --------------------------------------------------
        # Liveness probe endpoint (for Cloud Run / GKE)
        # --------------------------------------------------
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # --------------------------------------------------
        # Static assets — aggressive long-term caching
        # Vite appends content hashes to filenames so this is safe
        # --------------------------------------------------
        location ~* \.(js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            access_log  off;
            # Security headers still apply
            add_header  X-Content-Type-Options "nosniff" always;
        }

        # --------------------------------------------------
        # index.html — no cache (SPA shell must always be fresh)
        # --------------------------------------------------
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # --------------------------------------------------
        # SPA fallback — all unknown paths serve index.html
        # This allows React Router to handle client-side routing
        # --------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;

            # No caching for HTML responses
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # --------------------------------------------------
        # Deny access to dotfiles
        # --------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # --------------------------------------------------
        # Error pages
        # --------------------------------------------------
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
