# ============================================================
# Cell & Gene Therapy Tracking Platform
# Cloud Build CI/CD Pipeline
# ============================================================
#
# Substitutions (set in Cloud Build trigger or pass via --substitutions):
#   _REGION         GCP region, e.g. us-central1
#   _PROJECT_ID     GCP project ID
#   _SERVICE_NAME   Base service name, e.g. therapy-tracker
#   _IMAGE_NAME     Base image name, e.g. therapy-tracker
#   _ENVIRONMENT    staging | prod
#
# Required IAM on the Cloud Build SA:
#   - roles/run.admin
#   - roles/cloudsql.client
#   - roles/artifactregistry.writer
#   - roles/secretmanager.secretAccessor
#   - roles/storage.admin
# ============================================================

substitutions:
  _REGION: us-central1
  _PROJECT_ID: ${PROJECT_ID}
  _SERVICE_NAME: therapy-tracker
  _IMAGE_NAME: therapy-tracker
  _ENVIRONMENT: staging
  _ARTIFACT_REPO: therapy-tracker

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE
  dynamic_substitutions: true

timeout: 1800s # 30-minute overall timeout

steps:

  # --------------------------------------------------------
  # Step 1: Run backend unit & integration tests
  # --------------------------------------------------------
  - id: backend-tests
    name: python:3.11-slim
    dir: backend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "==> Installing test dependencies..."
        pip install --quiet -r requirements.txt
        pip install --quiet pytest pytest-asyncio pytest-cov httpx

        echo "==> Running pytest..."
        python -m pytest tests/ \
          --tb=short \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=70 \
          -v
    env:
      - ENVIRONMENT=test
      - DATABASE_URL=sqlite+aiosqlite:///./test.db
      - REDIS_URL=redis://localhost:6379/0
      - SECRET_KEY=test-secret-key-not-for-production
      - ANTHROPIC_API_KEY=test-key-not-real

  # --------------------------------------------------------
  # Step 2: Build backend Docker image
  # --------------------------------------------------------
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=backend/Dockerfile
      - --target=runtime
      - --tag=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-backend:$COMMIT_SHA
      - --tag=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-backend:latest
      - --cache-from=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-backend:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - ./backend
    waitFor:
      - backend-tests

  # --------------------------------------------------------
  # Step 3: Push backend image to Artifact Registry
  # --------------------------------------------------------
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-backend
    waitFor:
      - build-backend

  # --------------------------------------------------------
  # Step 4: Install frontend dependencies
  # --------------------------------------------------------
  - id: frontend-install
    name: node:20-alpine
    dir: frontend
    entrypoint: npm
    args:
      - ci
      - --prefer-offline
    waitFor:
      - "-" # start immediately, no dep on backend steps

  # --------------------------------------------------------
  # Step 5: Run frontend lint + type-check
  # --------------------------------------------------------
  - id: frontend-lint
    name: node:20-alpine
    dir: frontend
    entrypoint: sh
    args:
      - -c
      - |
        npm run lint || true
        npm run typecheck || true
    waitFor:
      - frontend-install

  # --------------------------------------------------------
  # Step 6: Build React frontend (production bundle)
  # --------------------------------------------------------
  - id: frontend-build
    name: node:20-alpine
    dir: frontend
    entrypoint: npm
    args:
      - run
      - build
    env:
      - VITE_ENVIRONMENT=$_ENVIRONMENT
      # API URL is injected at build time so nginx can serve correct env
      - VITE_API_URL=https://$_ENVIRONMENT-$_SERVICE_NAME-backend-uc.a.run.app
    waitFor:
      - frontend-lint

  # --------------------------------------------------------
  # Step 7: Build frontend Docker image (nginx)
  # --------------------------------------------------------
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=frontend/Dockerfile
      - --target=runtime
      - --tag=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-frontend:$COMMIT_SHA
      - --tag=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-frontend:latest
      - --cache-from=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-frontend:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - ./frontend
    waitFor:
      - frontend-build

  # --------------------------------------------------------
  # Step 8: Push frontend image to Artifact Registry
  # --------------------------------------------------------
  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-frontend
    waitFor:
      - build-frontend

  # --------------------------------------------------------
  # Step 9: Deploy backend to Cloud Run
  # --------------------------------------------------------
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_ENVIRONMENT-$_SERVICE_NAME-backend
      - --image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-backend:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=$_ENVIRONMENT-backend-sa@$_PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=ENVIRONMENT=$_ENVIRONMENT,GCP_PROJECT_ID=$_PROJECT_ID
      - --update-secrets=DB_PASSWORD=$_ENVIRONMENT-db-password:latest,REDIS_URL=$_ENVIRONMENT-redis-url:latest,ANTHROPIC_API_KEY=$_ENVIRONMENT-anthropic-api-key:latest,FIREBASE_SERVICE_ACCOUNT_JSON=$_ENVIRONMENT-firebase-service-account:latest
      - --vpc-connector=$_ENVIRONMENT-vpc-connector
      - --vpc-egress=private-ranges-only
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=300
      - --cpu=1
      - --memory=512Mi
      - --quiet
    waitFor:
      - push-backend

  # --------------------------------------------------------
  # Step 10: Deploy frontend to Cloud Run
  # --------------------------------------------------------
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_ENVIRONMENT-$_SERVICE_NAME-frontend
      - --image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-frontend:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=5
      - --concurrency=1000
      - --timeout=60
      - --cpu=1
      - --memory=256Mi
      - --quiet
    waitFor:
      - push-frontend

  # --------------------------------------------------------
  # Step 11: Run database migrations (alembic)
  # --------------------------------------------------------
  - id: db-migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "==> Running database migrations via Cloud Run Job..."

        # Run alembic upgrade head in a one-off Cloud Run execution
        gcloud run jobs create migrate-$SHORT_SHA \
          --image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-backend:$COMMIT_SHA \
          --region=$_REGION \
          --service-account=$_ENVIRONMENT-backend-sa@$_PROJECT_ID.iam.gserviceaccount.com \
          --set-env-vars=ENVIRONMENT=$_ENVIRONMENT,GCP_PROJECT_ID=$_PROJECT_ID \
          --update-secrets=DB_PASSWORD=$_ENVIRONMENT-db-password:latest,REDIS_URL=$_ENVIRONMENT-redis-url:latest \
          --vpc-connector=$_ENVIRONMENT-vpc-connector \
          --vpc-egress=private-ranges-only \
          --command=alembic \
          --args=upgrade,head \
          --max-retries=1 \
          --task-timeout=300s \
          --quiet

        gcloud run jobs execute migrate-$SHORT_SHA \
          --region=$_REGION \
          --wait \
          --quiet

        echo "==> Migrations complete."

        # Clean up job definition (optional — keeps console tidy)
        gcloud run jobs delete migrate-$SHORT_SHA \
          --region=$_REGION \
          --quiet || true
    waitFor:
      - deploy-backend

# Final Docker images produced by this build
images:
  - $_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-backend:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-backend:latest
  - $_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-frontend:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_IMAGE_NAME-frontend:latest
